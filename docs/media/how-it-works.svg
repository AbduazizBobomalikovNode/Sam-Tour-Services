<circle r="5" class="dot"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M290 265C325 265 320 150 353 150" keyPoints="0;0;1;1" keyTimes="0;.42;.48;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.42;.43;.47;.48;1"/></circle>
<circle r="5" class="dot"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M437 150H520" keyPoints="0;0;1;1" keyTimes="0;.52;.58;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.52;.53;.57;.58;1"/></circle>
<circle r="5" class="dot"><animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" path="M395 184V250" keyPoints="0;0;1;1" keyTimes="0;.55;.61;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.55;.56;.60;.61;1"/></circle>
