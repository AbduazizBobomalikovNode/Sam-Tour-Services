<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="ttl" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="ttl">Sam Tour Services qanday ishlaydi: mijoz botda ro'yxatdan o'tadi, kontakt MongoDB'ga yoziladi, adminlar guruhiga xabar boradi va boshqaruv panelida ko'rinadi</title>
<style>
.t{fill:#e6edf3;font-size:14px;font-weight:600}
.s{fill:#8b949e;font-size:11px}
.n{fill:#58a6ff;font-size:11px;font-weight:700;letter-spacing:1px}
.c{fill:#c9d1d9;font-size:10.5px}
.w{fill:#fff;font-size:10.5px;text-anchor:middle}
.k{fill:#e6edf3;font-size:10.5px;text-anchor:middle}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.bub{fill:#21262d}
.key{fill:#30363d}
.wire{stroke:#30363d;stroke-width:2;fill:none;stroke-dasharray:3 6;animation:flow 1s linear infinite}
.dot{fill:#58a6ff;opacity:0;filter:drop-shadow(0 0 5px #58a6ff)}
.fb{transform-box:fill-box}
.u1{animation:s4 14s infinite}.b1{animation:s8 14s infinite}.u2{animation:s14 14s infinite}.b2{animation:s20 14s infinite}
.u3{animation:s26 14s infinite}.u4{animation:s34 14s infinite}.b4{animation:s40 14s infinite}
.msg{animation:s58 14s infinite}.file{animation:s80 14s infinite}
.db{animation:db 14s infinite}.btn{animation:btn 14s infinite}
.old{animation:old 14s infinite}.new{animation:new 14s infinite}
.bar{transform-origin:bottom;animation:bar 14s infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
@keyframes s4{0%,4%{opacity:0;transform:translateY(6px)}6%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s8{0%,8%{opacity:0;transform:translateY(6px)}10%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s14{0%,14%{opacity:0;transform:translateY(6px)}16%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s20{0%,20%{opacity:0;transform:translateY(6px)}22%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s26{0%,26%{opacity:0;transform:translateY(6px)}28%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s34{0%,34%{opacity:0;transform:translateY(6px)}36%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s40{0%,40%{opacity:0;transform:translateY(6px)}42%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s58{0%,58%{opacity:0;transform:translateY(6px)}60%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes s80{0%,80%{opacity:0;transform:translateY(6px)}82%,97%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes db{0%,47%,56%,100%{fill:#161b22;stroke:#30363d}49%,54%{fill:#12261b;stroke:#3fb950}}
@keyframes btn{0%,71%,80%,100%{fill:#30363d}73%,78%{fill:#1f6feb}}
@keyframes old{0%,61%{opacity:1}63%,97%{opacity:0}100%{opacity:1}}
@keyframes new{0%,61%{opacity:0}63%,97%{opacity:1}100%{opacity:0}}
@keyframes bar{0%,61%{transform:scaleY(.72)}70%,97%{transform:scaleY(1)}100%{transform:scaleY(.72)}}
</style>

<rect width="1000" height="440" rx="16" fill="#0d1117"/>
<text x="30" y="38" class="t" font-size="17">Sam Tour Services qanday ishlaydi</text>

<!-- wires -->
<path class="wire" d="M290 265C325 265 320 150 353 150"/>
<path class="wire" d="M437 150H520"/>
<path class="wire" d="M395 184V250"/>

